[versions]

# SDK versions
compileSdk = "34"
minSdk = "26"
targetSdk = "34"
jvmTarget = "1.8"

# App Version
versionCode = "10100"
versionName = "1.1.0"

# Build
agp = "8.5.1"
androidTools = "31.2.0"

# AndroidX
androidx-core-ktx = "1.13.1"
androidx-lifecycle = "2.8.3"
androidx-lifecycle-runtime-ktx = "2.8.7"
androidx-datastore-preferences = "1.1.1"
androidx-appcompat = "1.7.0"
androidx-navigation-common-ktx = "2.8.5"

# Splash
androidx-core-splashscreen = "1.0.1"

# Media3
media3Ui = "1.4.1"

# Compose
androidx-compose-animation = "1.7.5"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
composeMaterial = "1.4.0"
navigationCompose = "2.8.3"
compose-runtime-android = "1.7.6"

# Kotlin
kotlin = "1.9.24"
kotlinxImmutable = "0.3.7"
jetbrainsKotlinJvm = "1.9.22"
ksp = "1.9.24-1.0.20"

# Coroutines
kotlinxCoroutinesPlayServices = "1.9.0"
kotlinxCoroutinesCore = "1.9.0"

# Coil
coil = "3.0.0"

# Firebase
firebaseBom = "33.5.1"
firebaseDynamicModuleSupportVersion = "16.0.0-beta03"
firebaseFirestoreKtx = "25.1.1"
firebaseFunctionsKtx = "21.1.0"
firebaseCrashlytics = "3.0.2"
geofireAndroidCommon = "3.2.0"

# Hilt
hilt = "2.51.1"
hiltNavigationCompose = "1.2.0"
inject = "1"

# Test
espressoCore = "3.6.1"
junit = "4.13.2"
junitVersion = "1.2.1"

# Google
googleServices = "4.4.2"

# Account
androidx-credentials = "1.3.0"
googleid = "1.1.1"

# Paging
pagingRuntime = "3.3.4"
pagingComposeAndroid = "3.3.4"

# Serialization
kotlinxSerializationJson = "1.6.0"

# Map
mapSdk = "3.19.1"
playServicesLocation = "21.3.0"

# Network
okhttp = "4.12.0"
retrofit = "2.11.0"

material = "1.12.0"

[libraries]
# AndroidX
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore-preferences" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle-runtime-ktx" }
androidx-navigation-common-ktx = { group = "androidx.navigation", name = "navigation-common-ktx", version.ref = "androidx-navigation-common-ktx" }

# Splash
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }

# Media3
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Ui" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3Ui" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Ui" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3Ui" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3Ui" }

# Hilt
inject = { group = "javax.inject", name = "javax.inject", version.ref = "inject" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-runtime-android = { group = "androidx.compose.runtime", name = "runtime-android", version.ref = "compose-runtime-android" }

# Paging
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "pagingRuntime" }

# Auth
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesCore" }
kotlinx-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxImmutable" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore-ktx = { group = "com.google.firebase", name = "firebase-firestore-ktx", version.ref = "firebaseFirestoreKtx" }
firebase-functions-ktx = { group = "com.google.firebase", name = "firebase-functions-ktx", version.ref = "firebaseFunctionsKtx" }

# goefire
geofire-android-common = { module = "com.firebase:geofire-android-common", version.ref = "geofireAndroidCommon" }
google-firebase-dynamic-module-support = { module = "com.google.firebase:firebase-dynamic-module-support", version.ref = "firebaseDynamicModuleSupportVersion" }

# Analytics
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Map
map-sdk = { module = "com.naver.maps:map-sdk", version.ref = "mapSdk" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

# Material Design
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "composeMaterial" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Network
okhttp = { group = "com.squareup.okhttp3", name = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlin-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

# Kotlinx Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Coil
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Paging
androidx-paging-compose-android = { group = "androidx.paging", name = "paging-compose-android", version.ref = "pagingComposeAndroid" }

# Build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[bundles]
androidx-core = [
    "androidx-core-ktx",
    "androidx-appcompat",
    "androidx-lifecycle-runtime-ktx",
]

# Compose
compose = [
    "compose-ui",
    "compose-ui-tooling-preview",
    "compose-runtime-android",
    "androidx-activity-compose",
    "androidx-lifecycle-viewmodel-compose",
]
compose-debug = [
    "compose-ui-tooling",
    "compose-ui-test-manifest",
    "compose-ui-test-junit4",
]
material = [
    "material",
    "compose-material",
    "compose-material3",
    "compose-material-icons-extended",
]

navigation = [
    "navigation-compose",
    "hilt-navigation-compose"
]

coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
]

datastore = [
    "androidx-datastore-preferences",
]

auth = [
    "androidx-credentials",
    "androidx-credentials-play-services-auth",
    "googleid",
]

# Network
retrofit = [
    "retrofit-core",
    "retrofit-kotlin-serialization",
]
okhttp = [
    "okhttp",
    "okhttp-logging",
]

# Firebase
firebase = [
    "firebase-firestore-ktx",
    "firebase-functions-ktx",
]
analytics = [
    "firebase-analytics",
    "firebase-crashlytics",
]
geofire = [
    "geofire-android-common",
    "google-firebase-dynamic-module-support",
]

# Coil
coil = [
    "coil",
    "coil-compose",
    "coil-network-okhttp",
]

media3 = [
    "androidx-media3-exoplayer",
    "androidx-media3-exoplayer-dash",
    "androidx-media3-ui",
    "androidx-media3-session",
    "androidx-media3-common",
]

map = [
    "map-sdk",
    "play-services-location",
]


# Plugins
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }

# Custom Plugins
musicroad-android-application = { id = "musicroad.android.application", version = "unspecified" }
